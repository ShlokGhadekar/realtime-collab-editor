# Local secrets live in backend/.env (gitignored); real env vars take precedence
spring.config.import=optional:file:.env[.properties]

# Server
server.port=${PORT:8080}

# Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/collabeditor}
spring.datasource.username=${DATABASE_USERNAME:collabuser}
spring.datasource.password=${DATABASE_PASSWORD:collabpass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT (no default on purpose: the app refuses to start without a secret)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# JDoodle (optional: code execution is disabled when unset)
jdoodle.client-id=${JDOODLE_CLIENT_ID:}
jdoodle.client-secret=${JDOODLE_CLIENT_SECRET:}

# Comma-separated list of frontend origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://realtime-collab-editor-two.vercel.app}
